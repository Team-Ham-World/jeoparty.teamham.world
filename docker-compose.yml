services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: https://quiz.teamham.world
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      PORT: 8080
      HAM_MODE: live
      HAM_ISSUER: https://teamham.world
      HAM_CLIENT_ID: quiz
      HAM_CLIENT_SECRET: ${HAM_CLIENT_SECRET:?Set HAM_CLIENT_SECRET in the private environment file}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in the private environment file}
      DATABASE_PATH: /data/quiz.sqlite
    volumes:
      - quiz-data:/data
    networks:
      proxy:
        aliases:
          - quiz-app
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 20s
networks:
  proxy:
    external: true
volumes:
  quiz-data:
