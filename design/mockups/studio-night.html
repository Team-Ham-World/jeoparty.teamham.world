<div id="ham-studio">
  <div class="preview-tools">
    <nav aria-label="Preview device">
      <button data-role="tv" aria-pressed="true">TV display</button>
      <button data-role="host" aria-pressed="false">Host desk</button>
      <button data-role="phone" aria-pressed="false">Player phone</button>
    </nav>
    <label
      >Scene
      <select aria-label="Preview scene">
        <option value="board">Game board</option>
        <option value="reading">Read clue</option>
        <option value="open">Buzzers open</option>
        <option value="answering">Answering</option>
        <option value="reveal">Answer reveal</option>
      </select></label
    >
  </div>
  <div class="mount"></div>
  <div class="assist" aria-live="polite"></div>
</div>
<style>
  #ham-studio {

  #ham-studio .clue {

  #ham-studio .host {

  #ham-studio .deskhead {

  #ham-studio .deskhead h2,
  #ham-studio .phone h2 {

  #ham-studio .host .picking {

  #ham-studio .deskgrid {

  #ham-studio .cue .over {

  #ham-studio .cue h3 {
    font: 750 clamp(23px, 3.8cqw, 52px)/1.09 var(--sans);

    border: 1px dashed #97896f;

  #ham-studio .key strong {

  #ham-studio .act {
    border: 1px solid var(--ink);

  #ham-studio .act.alt {

  #ham-studio .phone-bed {
    display: grid;

      repeating-linear-gradient(135deg, transparent 0 12px, #c6bdd014 12px 14px), var(--night);

  #ham-studio .phone {
    width: min(100%, 330px);

  #ham-studio .phone .station {

  #ham-studio .phone .over {

  #ham-studio .phone-main {

  #ham-studio .phone h2 {
    font-size: 36px;

  #ham-studio .pad {
    display: grid;

      0 6px 0 var(--ink),
      inset 0 0 0 3px var(--milk);
    background: #d4ccd9;
    color: #514857;
    font: 850 24px/1.05 var(--sans);

  #ham-studio button.pad {
    background: var(--orange);
    color: var(--ink);

  #ham-studio .phone-foot {

  @container (max-width:470px) {
    #ham-studio nav button {
      font-size: 12px;

    #ham-studio select {

    }
    #ham-studio .category {
      min-height: 36px;
      padding: 3px 1px 6px;

    }
    #ham-studio .deskgrid {

    }
    #ham-studio .pick {
      font-size: 8px;

    #ham-studio .who {
      gap: 3px;

</style>
<script>
  (() => {
    const root = document.getElementById("ham-studio");
    const mount = root.querySelector(".mount");
    const scene = root.querySelector("select");
    const pack = [
      [
        "On screen",
        [
          ["What color is the brick road to the Emerald City?", "Yellow"],
          ["Which studio made Spirited Away?", "Studio Ghibli"],
          ["In Alien, what is the name of the ship’s cat?", "Jones"],
          ["Who directed the film Get Out?", "Jordan Peele"],
        ],
      ],
      [
        "Mixtape",
        [
          ["How many strings does a standard violin have?", "Four"],
          ["Which band recorded the album Abbey Road?", "The Beatles"],
          ["Which singer released the album Lemonade?", "Beyoncé"],
          ["What instrument did jazz musician Thelonious Monk play?", "Piano"],
        ],
      ],
      [
        "Outer space",
        [
          ["Which planet is known as the Red Planet?", "Mars"],
          ["Which planet spins on its side?", "Uranus"],
          ["Which planet has a giant storm called the Great Red Spot?", "Jupiter"],
          ["What is the largest moon of Saturn?", "Titan"],
        ],
      ],
      [
        "Table talk",
        [
          ["What is the main ingredient in guacamole?", "Avocado"],
          ["What type of pasta is shaped like little ears?", "Orecchiette"],
          ["Which spice comes from the stigma of a crocus?", "Saffron"],
          ["Which Japanese stock traditionally combines kombu and bonito flakes?", "Dashi"],
        ],
      ],
      [
        "Arcade",
        [
          ["Which yellow arcade character eats dots in a maze?", "Pac-Man"],
          ["In chess, which piece moves in an L shape?", "Knight"],
          ["How many squares make up each standard Tetris piece?", "Four"],
          ["Which arcade game first featured Mario?", "Donkey Kong"],
        ],
      ],
    ];
    const players = ["Mika", "Jules", "Remy"];
    const starting = [700, 400, 200];
    const initialUsed = ["0-0", "0-1", "1-0", "1-1", "2-0", "3-1", "4-3"];
    let used = new Set(initialUsed),
      scores = starting.slice(),
      controller = 0;
    let role = "tv",
      phase = "board",
      cat = 2,
      tier = 2,
      winner = 1,
      correct = true;
    const value = () => (tier + 1) * 100;
    const clue = () => pack[cat][1][tier];
    const status = () =>
      ({
        board: players[controller] + " picks",
        reading: "Buzzers closed",
        open: "Buzzers open",
        answering: players[winner] + " answers",
        judged: correct ? "Correct answer" : "Incorrect answer",
        reveal: "Answer revealed",
        finished: "Round complete",
      })[phase];
    const setPhase = (p) => {
      phase = p;
      render();
      root.querySelector(".assist").textContent = status();
    };
    const station = (label) =>
      '<div class="station"><span class="bug"><span aria-hidden="true" class="mark"></span> HAM Network</span><span class="meta live">' +
      label +
      "</span></div>";
    function standings() {
      return (
        '<div class="lower">' +
        players
          .map(
            (p, i) =>
              '<div class="score ' +
              (i === controller ? "picking" : "") +
              '"><div class="who">' +
              p +
              (i === controller && phase === "board" ? ' <span class="pick">PICKS</span>' : "") +
              '</div><strong class="tally">' +
              scores[i].toLocaleString() +
              "</strong></div>",
          )
          .join("") +
        "</div>"
      );
    }
    function board(interactive) {
      return (
        '<div class="board">' +
        pack
          .map(
            ([category, clues], c) =>
              '<div class="column"><div class="category">' +
              category +
              "</div>" +
              clues
                .map((_, t) => {
                  const key = c + "-" + t,
                    n = (t + 1) * 100;
                  if (used.has(key))
                    return (
                      '<div class="tile used" aria-label="' +
                      category +
                      " " +
                      n +
                      ', played">–</div>'
                    );
                  return interactive
                    ? '<button class="tile" data-cell="' +
                        key +
                        '" aria-label="' +
                        category +
                        " for " +
                        n +
                        '">' +
                        n +
                        "</button>"
                    : '<div class="tile">' + n + "</div>";
                })
                .join("") +
              "</div>",
          )
          .join("") +
        "</div>"
      );
    }
    const act = (id, label, alt = false) =>
      '<button class="act ' + (alt ? "alt" : "") + '" data-act="' + id + '">' + label + "</button>";
    function actions() {
      if (phase === "board") return "";
      if (phase === "reading")
        return act("open", "Open buzzers") + act("reveal", "Reveal answer", true);
      if (phase === "open")
        return act("phone", "Go to player buzzer") + act("reveal", "Reveal answer", true);
      if (phase === "answering")
        return act("yes", "Correct +" + value()) + act("no", "Incorrect −" + value(), true);
      if (phase === "judged") return act("reveal", "Reveal answer");
      if (phase === "finished") return act("reset", "Replay round");
      return act("return", "Return to board");
    }
    function tv() {
      const header =
        '<div class="hero"><span class="over">Round 01</span><h2 class="logo">HAM <em>QUIZ</em></h2><div class="sun" aria-hidden="true"><span class="orbit"></span></div></div>';
      const content =
        phase === "board"
          ? board(false)
          : phase === "finished"
            ? '<div class="clue"><span class="over">Round complete</span><h3>' +
              players.filter((p, i) => scores[i] === Math.max(...scores)).join(" &amp; ") +
              " wins!</h3></div>"
            : '<div class="clue"><span class="over">' +
              pack[cat][0] +
              " / " +
              value() +
              " points</span><h3>" +
              (phase === "reveal" ? clue()[1] : clue()[0]) +
              '</h3><div class="state">' +
              status() +
              "</div></div>";
      return (
        '<section class="set" aria-label="TV display">' +
        station("On air") +
        header +
        content +
        standings() +
        "</section>"
      );
    }
    function host() {
      const title =
        phase === "board"
          ? "Pick a clue"
          : phase === "reading"
            ? "Read the clue"
            : phase === "open"
              ? "Waiting for a buzz"
              : status();
      const panel =
        phase === "board"
          ? "<p>" + players[controller] + " chooses. Select their clue below.</p>"
          : "";
      const cues =
        '<div class="deskgrid"><div class="cue"><span class="over">On the TV</span><h3>' +
        (phase === "reveal" ? clue()[1] : clue()[0]) +
        '</h3></div><div class="key"><span class="over">Host answer key</span><strong>' +
        clue()[1] +
        "</strong></div></div>";
      return (
        '<section class="host" aria-label="Host desk">' +
        station("Host desk") +
        '<div class="deskhead"><span class="over">Round 01' +
        (phase === "board" || phase === "finished"
          ? ""
          : " / " + pack[cat][0] + " / " + value() + " pts") +
        "</span><h2>" +
        title +
        "</h2>" +
        panel +
        "</div>" +
        (phase === "board" ? board(true) : phase === "finished" ? "" : cues) +
        '<div class="actions">' +
        actions() +
        "</div>" +
        standings() +
        "</section>"
      );
    }
    function phone() {
      const title = {
        board: controller === 1 ? "Your pick" : players[controller] + " picks",
        reading: "Listen up",
        open: "You can buzz",
        answering: "You’re up!",
        judged: correct ? "Correct!" : "Incorrect",
        reveal: clue()[1],
        finished: "Round complete",
      }[phase];
      const pad =
        phase === "open"
          ? '<button class="pad" data-act="buzz">BUZZ</button>'
          : phase === "reading"
            ? '<div class="pad">Wait for<br>the host</div>'
            : "";
      const detail = {
        board:
          controller === 1
            ? "Tell the host your category and points."
            : "Watch the board on the TV.",
        answering: "Say your answer out loud.",
        judged: (correct ? "+" : "−") + value() + " points",
        reveal: "Answer revealed",
        finished: "Final score",
        open: "",
        reading: "",
      }[phase];
      return (
        '<div class="phone-bed"><section class="phone" aria-label="Jules’s phone">' +
        station("Player 02") +
        '<div class="phone-main"><span class="over">' +
        (phase === "board" || phase === "finished"
          ? "Round 01"
          : pack[cat][0] + " / " + value() + " pts") +
        "</span><h2>" +
        title +
        "</h2>" +
        pad +
        "<p>" +
        detail +
        '</p></div><div class="phone-foot"><b>Jules</b><span>' +
        scores[1] +
        " pts</span></div></section></div>"
      );
    }
    function render() {
      mount.innerHTML = role === "tv" ? tv() : role === "host" ? host() : phone();
      root
        .querySelectorAll("[data-role]")
        .forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.role === role)));
      for (const option of [...scene.options]) if (option.dataset.extra) option.remove();
      if (phase === "judged" || phase === "finished") {
        const o = new Option(status(), phase);
        o.dataset.extra = "true";
        scene.add(o);
      }
      scene.value = phase;
    }
    function reset() {
      used = new Set(initialUsed);
      scores = starting.slice();
      controller = 0;
      cat = 2;
      tier = 2;
      winner = 1;
      correct = true;
    }
    scene.addEventListener("change", () => {
      const selected = scene.value;
      reset();
      setPhase(selected);
    });
    root.addEventListener("click", (event) => {
      const b = event.target.closest("button");
      if (!b) return;
      if (b.dataset.role) {
        role = b.dataset.role;
        render();
        return;
      }
      if (b.dataset.cell) {
        [cat, tier] = b.dataset.cell.split("-").map(Number);
        setPhase("reading");
        return;
      }
      switch (b.dataset.act) {
        case "open":
          setPhase("open");
          break;
        case "phone":
          role = "phone";
          render();
          break;
        case "buzz":
          winner = 1;
          setPhase("answering");
          break;
        case "yes":
        case "no":
          correct = b.dataset.act === "yes";
          scores[winner] += correct ? value() : -value();
          if (correct) controller = winner;
          setPhase("judged");
          break;
        case "reveal":
          setPhase("reveal");
          break;
        case "return":
          used.add(cat + "-" + tier);
          setPhase(used.size === 20 ? "finished" : "board");
          break;
        case "reset":
          reset();
          setPhase("board");
          break;
      }
    });
    render();
  })();
</script>
