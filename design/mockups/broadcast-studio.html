      #broadcast {
        --ink: #191621;
        --cream: #faf4e9;
        --panel: #eee6d8;
        --rule: #d4c9b9;
        --quiet: #5e5665;
        --purple: #504388;
        --light: #c6b8ff;
        --peach: #ff9864;
        --mono: ui-monospace, "Courier New", monospace;
        --sans: Studio, Arial, Helvetica, sans-serif;
        font: 500 15px/1.36 var(--sans);
        color: var(--ink);
        container-type: inline-size;
      }
      #broadcast * {
        box-sizing: border-box;
      }
      #broadcast :is(h1, h2, h3, p, ul, ol) {
        margin: 0;
      }
      #broadcast button,
      #broadcast input,
      #broadcast select,
      #broadcast textarea {
        font: inherit;
      }
      #broadcast button {
        cursor: pointer;
      }
      #broadcast button:disabled {
        cursor: default;
        opacity: 0.52;
      }
      #broadcast :focus-visible {
        outline: 3px solid #2182ed;
        outline-offset: 3px;
      }
      #broadcast h1,
      #broadcast h2,
      #broadcast h3 {
        letter-spacing: -0.055em;
        line-height: 1.02;
      }
      #broadcast h1 {
        font-size: clamp(43px, 7.8cqw, 92px);
        font-weight: 800;
      }
      #broadcast h2 {
        font-size: clamp(23px, 3.5cqw, 39px);
        font-weight: 780;
      }
      #broadcast h3 {
        font-size: clamp(17px, 2.4cqw, 27px);
      }
      #broadcast .shell {
        overflow: hidden;
        background: var(--cream);
        color: var(--ink);
        border: 1px solid var(--rule);
        border-radius: 16px;
      }
      #broadcast .nav {
        display: flex;
        align-items: center;
        gap: clamp(10px, 2.5cqw, 30px);
        padding: 12px clamp(14px, 3.5cqw, 40px);
        border-bottom: 1px solid var(--rule);
      }
      #broadcast .word {
        font-size: clamp(17px, 2.7cqw, 30px);
        font-weight: 850;
        letter-spacing: -0.07em;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      #broadcast .brandbtn,
      #broadcast .navlink,
      #broadcast .textbtn {
        border: 0;
        background: none;
        color: inherit;
        padding: 5px 0;
      }
      #broadcast .brandicon {
        display: inline-block;
        width: 25px;
        height: 19px;
        background: repeating-linear-gradient(90deg, var(--purple) 0 5px, transparent 5px 8px);
        transform: skew(-14deg);
      }
      #broadcast .navlink {
        font-size: 14px;
        font-weight: 680;
        color: var(--quiet);
      }
      #broadcast .navlink.current {
        color: var(--ink);
        box-shadow: 0 2px 0 var(--ink);
      }
      #broadcast .user {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 650;
        font-size: 13px;
      }
      #broadcast .avatar {
        display: inline-grid;
        place-items: center;
        background: #d9cffa;
        color: #39295c;
        width: 31px;
        height: 31px;
        border-radius: 50%;
        font-weight: 750;
        font-size: 15px;
      }
      #broadcast .hero,
      #broadcast .tv {
        color: var(--cream);
        background: var(--ink);
        position: relative;
        isolation: isolate;
      }
      #broadcast .hero {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        align-items: center;
        min-height: clamp(185px, 28cqw, 315px);
        padding: clamp(21px, 3.8cqw, 50px);
        overflow: hidden;
      }
      #broadcast .hero:before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse at 84% 66%, #534472 0%, transparent 60%), var(--ink);
      }
      #broadcast .kicker,
      #broadcast .micro {
        font: 700 clamp(10px, 1.4cqw, 15px)/1.25 var(--mono);
        letter-spacing: 0.095em;
        text-transform: uppercase;
      }
      #broadcast .hero .kicker,
      #broadcast .tv .kicker {
        color: var(--light);
      }
      #broadcast .hero h1 {
        margin: 10px 0 7px;
      }
      #broadcast .hero h1 i,
      #broadcast .tv h1 i {
        color: var(--peach);
        font-style: italic;
      }
      #broadcast .hero p {
        max-width: 32ch;
        color: #ded4dc;
        font-size: clamp(14px, 2cqw, 23px);
      }
      #broadcast .art {
        position: relative;
        justify-self: center;
        width: 91%;
        max-width: 345px;
        aspect-ratio: 1.7;
        isolation: isolate;
        pointer-events: none;
      }
      #broadcast .art:before {
        content: "";
        position: absolute;
        inset: -20% -17%;
        z-index: -2;
        background-image: radial-gradient(#ad97db69 0.9px, transparent 1.2px);
        background-size: 7px 7px;
        mask-image: radial-gradient(ellipse, #000 30%, transparent 73%);
      }
      #broadcast .orbit {
        position: absolute;
        inset: 28% -7% 12%;
        border: 1px solid #a492c888;
        border-radius: 50%;
        transform: rotate(-19deg);
        z-index: -1;
      }
      #broadcast .spark {
        position: absolute;
        background: var(--peach);
        clip-path: polygon(50% 0, 57% 41%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
        width: 9%;
        aspect-ratio: 1;
        right: -2%;
        top: 5%;
      }
      #broadcast .spark.two {
        width: 5%;
        top: 79%;
        left: -1%;
        background: var(--light);
      }
      #broadcast .receiver {
        position: absolute;
        inset: 13% 6% 5% 6%;
        border: 3px solid #1d1929;
        border-radius: 12% / 17%;
        transform: rotate(-6deg);
        background: linear-gradient(160deg, #f3c49c 0 8%, #dc9471 9% 65%, #af654f);
        box-shadow:
          4px 6px 0 #8a584a,
          7px 10px 0 #191421;
        display: grid;
        grid-template-columns: 1fr 15%;
        gap: 4%;
        padding: 5%;
      }
      #broadcast .receiver:before,
      #broadcast .receiver:after {
        content: "";
        position: absolute;
        width: 2px;
        height: 30%;
        background: #c3aeb1;
        left: 48%;
        bottom: 100%;
        transform: rotate(-48deg);
        transform-origin: bottom;
      }
      #broadcast .receiver:after {
        transform: rotate(39deg);
        height: 35%;
      }
      #broadcast .glass {
        border: 4px solid #352d38;
        border-radius: 16% / 23%;
        background:
          repeating-linear-gradient(0deg, transparent 0 3px, #24173333 3px 4px),
          radial-gradient(ellipse at 37% 40%, #9d91d2, #6c5aa3 62%, #332949);
        color: #fff3d8;
        display: grid;
        place-content: center;
        text-align: center;
        box-shadow: inset 0 0 0 2px #3b314c;
        overflow: hidden;
        font: bold italic clamp(19px, 5cqw, 59px)/0.78 var(--sans);
        letter-spacing: -0.1em;
        text-shadow: 2px 2px 0 #483862;
      }
      #broadcast .glass b:last-child {
        color: #ffbe85;
      }
      #broadcast .tuner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-around;
      }
      #broadcast .dial {
        width: 80%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: linear-gradient(135deg, #473a3d 0 44%, #e8bc97 46% 53%, #493b40 55%);
        border: 2px solid #6b4842;
        box-shadow: 1px 2px 0 #9f604e;
      }
      #broadcast .vents {
        width: 95%;
        height: 33%;
        background: repeating-linear-gradient(0deg, #88584b 0 2px, transparent 2px 4px);
      }
      #broadcast .body {

                    "</label>"
                  : "") +
                (v?.phase === "lobby" && role === "host" && v.players.length < 6
                  ? link("demoPlayers", "Add demo players")
                  : "")
              : "");
          const d = engine.nextDeadline(game);
          if (d)
            deadline = setTimeout(
              () => {
                send({ type: "timerExpired", timerId: d.timerId }, system);
                render();
              },
              Math.max(0, d.at - Date.now()) + 5,
            );
        }
        const setPage = (p) => {
          page = p;
          operator = "";
          say("");
        };
        const choose = (i) => {
          selected = i;
          config = engine.defaultSettings(packs[i]);
        };
        function jump(to) {
          advanced = false;
          operator = "";
          editingSetup = false;
          sessionDrafts = {};
          say("");
          if (["home", "signin", "setup", "join", "library", "editor"].includes(to)) {
            if (to === "editor") editPack(0);
            else setPage(to);
            if (to === "signin") {
              signed = false;
              accountFor = "home";
            } else signed = true;
            return;
          }
          signed = true;
          role = "host";
          page = "room";
          active = "Jules";
          choose(to === "round2" ? 0 : 1);
          makeRoom(true);
          if (to === "lobby") return;
          if (to === "round2")
            send({ type: "updateSettings", patch: { rounds: 2, categoriesPerRound: 1 } });
          send({ type: "startGame" });
          if (to === "roundIntro") return;
          send({ type: "continue" });
          for (const [id, delta] of [
            ["Mika", 800],
            ["Jules", 600],
            ["Remy", 400],
          ])
            send({
              type: "adjustScore",
              playerId: id,
              delta,
              reason: "Sample scores for this scene",
            });
          if (to === "board") return;
          if (to === "paused" || to === "recovery") {
            send({ type: to === "paused" ? "pause" : "restored" }, to === "paused" ? host : system);
            return;
          }
          if (to === "results") {
            send({ type: "endGame" });
            return;
          }
          if (["wagers", "finalAnswer", "judging", "round2"].includes(to)) {
            const cells = hv().board.categories.flatMap((c) => c.cells);
            for (const c of cells) {
              send({ type: "selectClue", clueId: c.clueId });
              if (c.wager) send({ type: "endAttempts", clueId: c.clueId });
              send({ type: "reveal", clueId: c.clueId });
              send({ type: "returnToBoard", clueId: c.clueId });
            }
            if (to === "round2" || to === "wagers") return;
            for (const p of hv().players)
              send({ type: "submitFinalWager", amount: 100 }, actor(p.id));
            send({ type: "showFinalClue" });
            if (to === "judging") {
              for (const p of hv().players)
                send(
                  {
                    type: "submitFinalAnswer",
                    text: p.id === "Remy" ? "No guess" : hv().final.answer,
                  },
                  actor(p.id),
                );
              send({ type: "lockFinalAnswers" });
            }
            return;
          }
          const chosen = hv()
            .board.categories.flatMap((c) => c.cells)
            .find((c) => c.wager === (to === "wager"));
          const clueId = chosen.clueId;
          send({ type: "selectClue", clueId });
          if (to === "open" || to === "answering") send({ type: "openBuzzers", clueId, leadMs: 0 });
          if (to === "answering") {
            buzz();
            const d = engine.nextDeadline(game);
            if (d && game.clue?.stage === "open")
              send({ type: "timerExpired", timerId: d.timerId }, system, d.at + 1);
          }
          if (to === "revealed") send({ type: "reveal", clueId });
        }
        function buzz() {
          const v = engine.playerView(game, active, Date.now());
          if (!v?.can.buzz) return;
          const now = Date.now();
          send(
            {
              type: "buzz",
              clueId: v.clue.clueId,
              openingId: v.clue.openingId,
              reactionMs: Math.max(0, now - v.clue.opensAt),
              falseStart: false,
              arrivalMs: now,
              uplinkBoundMs: 0,
              maxOtherUplinkMs: 0,
            },
            actor(active),
            now,
          );
        }
        function requestAccount(target) {
          accountFor = target;
          setPage(signed ? target : "signin");
        }
        root.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          const a = b.dataset.act,
            v = page === "room" ? view() : null;
          say("");
          if (b.dataset.choose !== undefined) choose(+b.dataset.choose);
          else if (b.dataset.editpack !== undefined) editPack(+b.dataset.editpack);
          else if (b.dataset.cell) {
            sessionDrafts = {};
            send({ type: "selectClue", clueId: b.dataset.cell });
          } else if (b.dataset.remove) send({ type: "removePlayer", playerId: b.dataset.remove });
          else if (!a) return;
          else
            switch (a) {
              case "home":
              case "library":
                setPage(a);
                break;
              case "auth":
                signed = true;
                setPage(accountFor);
                break;
              case "setup":
                editingSetup = false;
                advanced = false;
                requestAccount("setup");
                break;
              case "join":
                requestAccount("join");
                break;
              case "returnRoom":
                page = "room";
                role = "host";
                break;
              case "showTV":
                role = "tv";
                break;
              case "copyCode": {
                const copyManually = () => {
                  const selection = window.getSelection(),
                    range = document.createRange();
                  range.selectNodeContents(app.querySelector(".code"));
                  selection.removeAllRanges();
                  selection.addRange(range);
                  say("Room code selected. Use your device’s Copy command.");
                };
                if (navigator.clipboard?.writeText)
                  navigator.clipboard
                    .writeText(code)
                    .then(() => say("Room code copied."), copyManually);
                else copyManually();
                return;
              }
              case "advanced":
                advanced = !advanced;
                break;
              case "editSetup":
                editingSetup = true;
                advanced = true;
                selected = packs.findIndex((p) => p.id === v.pack.id);
                config = structuredClone(v.settings);
                page = "setup";
                break;
              case "leave":
                send({ type: "removeMember", playerId: active }, system);
                setPage("home");
                break;
              case "demoPlayers":
                names
                  .filter((n) => !game.players.some((p) => p.id === n))
                  .slice(0, Math.min(3, 6 - game.players.length))
                  .forEach(addPlayer);
                break;
              case "operator":
                operator = operator ? "" : "controls";
                break;
              case "newPack":
                editPack(-1);
                break;
              case "duplicate":
                sourceIndex = -1;
                editor.id = "pack-" + Date.now();
                editor.title += " remix";
                editor.custom = true;
                break;
              case "addCat":
                if (editor.categories.length < 12) {
                  editor.categories.push(blankCategory(editor.dimensions.cluesPerCategory));
                  ci = editor.categories.length - 1;
                  qi = 0;
                  editor.dimensions.categories++;
                } else say("A pack can hold up to 12 categories.");
                break;
              case "addCl":
                if (editor.dimensions.cluesPerCategory < 5) {
                  editor.dimensions.cluesPerCategory++;
                  for (const c of editor.categories)
                    c.clues.push({ ...blankClue(), tier: editor.dimensions.cluesPerCategory });
                  qi = editor.dimensions.cluesPerCategory - 1;
                } else say("Each category can hold up to five clues.");
                break;
              case "removePic":
                delete editClue().picture;
                break;
              case "savePack": {
                const r = validateQuestionPack(editor);
                if (!r.ok) {
                  app.querySelector(".error").textContent =
                    r.errors[0].path + " · " + r.errors[0].message;
                  return;
                }
                if (sourceIndex < 0) {
                  packs.push(editor);
                  sourceIndex = packs.length - 1;
                } else packs[sourceIndex] = editor;
                choose(sourceIndex);
                page = "library";
                say("Pack saved for this walkthrough.");
                break;
              }
              case "usePack":
                choose(sourceIndex);
                advanced = false;
                editingSetup = created && game.phase === "lobby";
                page = "setup";
                break;
              case "buzz":
                buzz();
                break;
              case "correct":
              case "incorrect":
                send({
                  type: "judge",
                  clueId: v.clue.clueId,
                  attemptId: v.clue.attempts.at(-1).id,
                  correct: a === "correct",
                });
                break;
              case "correctFinal":
              case "incorrectFinal":
                send({
                  type: "judgeFinal",
                  playerId: v.final.nextResponderId,
                  correct: a === "correctFinal",
                });
                break;
              case "revealFinalResponse":
                send({ type: a, playerId: v.final.nextResponderId });
                break;
              case "openBuzzers":
                send({ type: a, clueId: v.clue.clueId, leadMs: 0 });
                break;
              case "reveal":
              case "returnToBoard":
              case "endAttempts":
                send({ type: a, clueId: v.clue.clueId });
                break;
              case "resume":
              case "pause":
              case "continue":
              case "startGame":
              case "endGame":
              case "playAgain":
              case "showFinalClue":
              case "lockFinalAnswers":
              case "finishGame":
                operator = "";
                if (a === "playAgain") sessionDrafts = {};
                send({ type: a });
                break;
            }
          render();
        });
        root.addEventListener("input", (e) => {
          const n = e.target.name,
            val = e.target.value;
          if (page === "editor" && (sourceIndex < 0 || sourceIndex >= 2)) {
            if (n === "packTitle") editor.title = val;
            if (n === "catTitle") editor.categories[ci].title = val;
            if (n === "prompt" || n === "answer") editClue()[n] = val;
            if (n === "alt" && editClue().picture) editClue().picture.alt = val;
          }
          if (page === "room" && role === "phone" && game.phase === "clue" && n === "amount")
            sessionDrafts[active + "c"] = val;
          if (page === "room" && role === "phone" && game.phase === "final") {
            if (n === "answer") sessionDrafts[active + "a"] = val;
            if (n === "amount") sessionDrafts[active + "w"] = val;
          }
        });
        root.addEventListener("change", async (e) => {
          const el = e.target,
            n = el.name,
            val = el.value;
          if (n === "scene") jump(val);
          else if (n === "role") {
            role = val;
            if (
              role === "phone" &&
              game.players.length &&
              !game.players.concat(game.waitingPlayers).some((p) => p.id === active)
            )
              active = game.players[0].id;
            operator = "";
          } else if (n === "seat") {
            active = val;
          } else if (page === "editor") {
            if (n === "cat") {
              ci = +val;
              qi = 0;
            } else if (n === "cl") qi = +val;
            else if (n === "tier") editClue().tier = +val;
            else if (n === "picture" && el.files[0]) {
              const f = el.files[0];
              if (!["image/png", "image/webp", "image/jpeg"].includes(f.type) || f.size > 1048576) {
                say("Choose a PNG, JPEG, or WebP under 1 MB.");
                return;
              }
              const id =
                "pic_" +
                Array.from(
                  crypto.getRandomValues(new Uint8Array(43)),
                  (x) => "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-"[x % 64],
                ).join("");
              const target = editClue();
              const reader = new FileReader();
              reader.onload = () => {
                pictures.set("/api/pictures/" + id, reader.result);
                target.picture = { id, alt: "" };
                render();
              };
              reader.readAsDataURL(f);
              return;
            } else return;
          } else if (page === "setup") {
            if (n === "rounds") {
              config.rounds = +val;
              config.categoriesPerRound = Math.min(
                config.categoriesPerRound,
                Math.floor(packs[selected].categories.length / +val),
              );
            } else if (n === "categories") config.categoriesPerRound = +val;
            else if (n.startsWith("wager")) config.wagerClues[+n.at(-1)] = +val;
            else if (n === "timers") config.timers.enabled = el.checked;
            else if (["final", "fair", "lockout"].includes(n))
              config[
                { final: "finalRound", fair: "fairBuzzing", lockout: "falseStartLockout" }[n]
              ] = el.checked;
            else if (["buzzWindowMs", "answerWindowMs", "finalAnswerMs"].includes(n)) {
              if (!el.reportValidity()) return;
              config.timers[n] = +val * 1000;
              return;
            } else return;
            config.wagerClues = config.wagerClues.map((w) =>
              Math.min(w, config.categoriesPerRound * packs[selected].dimensions.cluesPerCategory),
            );
          } else return;
          say("");
          render();
        });
        root.addEventListener("submit", (e) => {
          e.preventDefault();
          const f = e.target;
          const data = Object.fromEntries(new FormData(f));
          if (f.dataset.form === "setup") {
            if (editingSetup) {
              if (
                !send({ type: "setPack", pack: packs[selected] }) ||
                !send({ type: "updateSettings", patch: config })
              )
                return;
            } else makeRoom();
            editingSetup = false;
            advanced = false;
            page = "room";
            role = "host";
          } else if (f.dataset.form === "join") {
            if (data.code.trim().toUpperCase() !== code) {
              f.querySelector(".error").textContent =
                "Room not found. Try the demo code " + code + ".";
              return;
            }
            if (!created) makeRoom();
            active = data.name;
            if (
              !game.players.concat(game.waitingPlayers).some((p) => p.id === active) &&
              !addPlayer(active)
            ) {
              f.querySelector(".error").textContent = feedback.textContent;
              return;
            }
            page = "room";
            role = "phone";
          } else if (f.dataset.form === "adjust") {
            if (
              !send({
                type: "adjustScore",
                playerId: data.player,
                delta: +data.delta,
                reason: data.reason,
              })
            )
              return;
            say("Score corrected.");
            operator = "";
          } else if (f.dataset.form === "clueWager")
            send(
              { type: "submitWager", clueId: game.clue.clueId, amount: +data.amount },
              role === "host" ? host : actor(active),
            );
          else if (f.dataset.form === "finalWager") {
            if (send({ type: "submitFinalWager", amount: +data.amount }, actor(active)))
              say("Wager submitted. You can edit it until the host shows the clue.");
          } else if (f.dataset.form === "finalAnswer") {
            if (send({ type: "submitFinalAnswer", text: data.answer }, actor(active)))
              say("Answer submitted.");
          }
          render();
        });
        setInterval(() => {
          if (page !== "room" || game.paused) return;
          const d = engine.nextDeadline(game),
            el = app.querySelector("[data-time]");
          if (d && el) {
            const seconds = Math.max(0, Math.ceil((d.at - Date.now()) / 1000));
            el.textContent = seconds + " s remaining";
            if (
              seconds <= 5 &&
              game.phase === "final" &&
              game.final.stage === "answering" &&
              role === "phone" &&
              sessionDrafts[active + "a"] !== undefined &&
              engine.playerView(game, active, Date.now())?.myFinal?.answer !==
                sessionDrafts[active + "a"]
            )
              send({ type: "submitFinalAnswer", text: sessionDrafts[active + "a"] }, actor(active));
          }
        }, 250);
        render();
      })();
    </script>
  </body>
</html>
